

<!-- login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>BMI User Interface</title>
    <link rel="icon" type="image/x-icon" href="/static/images/favicon.ico">
    <link rel="stylesheet" href="/static/styles/login.css?v=1.4" />
</head>
<body>
    <form class="loginForm" id="loginForm">
        <h1>Bare Metal Imaging</h1>
        <h5>primary MS ID, Must be part of group "bmi_api_users"</h5>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <button id="submitButton" type="submit">Login</button>
        <div id="loginMessage"></div>
    </form>
</body>
<script src="/static/js/login.js?v=1.4"></script>
</html>
